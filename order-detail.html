<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理系统 - 订单详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .btn-group button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            background: #1989fa;
            color: #fff;
            cursor: pointer;
            margin-left: 10px;
        }
        .detail-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .order-base {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .order-base p {
            margin: 8px 0;
            color: #333;
        }
        .order-base .label {
            color: #666;
            display: inline-block;
            width: 80px;
        }
        .order-goods {
            margin-bottom: 20px;
        }
        .goods-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .goods-table {
            width: 100%;
            border-collapse: collapse;
        }
        .goods-table th, .goods-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .order-total {
            text-align: right;
            font-size: 16px;
            font-weight: bold;
            color: #ff4d4f;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">订单详情</div>
        <div class="btn-group">
            <button onclick="window.location.href='order-list.html'">返回列表</button>
            <button onclick="window.location.href='index.html'">返回主页</button>
        </div>
    </div>

    <div class="detail-card">
        <div class="order-base">
            <p><span class="label">订单号：</span>OD20260308001</p>
            <p><span class="label">下单时间：</span>2026-03-08 09:25:36</p>
            <p><span class="label">支付状态：</span><span style="color: #52c41a;">已支付</span></p>
            <p><span class="label">支付方式：</span>微信支付</p>
            <p><span class="label">收货人：</span>莫振江</p>
            <p><span class="label">收货地址：</span>北京市海淀区中关村大街1号</p>
            <p><span class="label">联系电话：</span>13800138000</p>
        </div>

        <div class="order-goods">
            <div class="goods-title">商品信息</div>
            <table class="goods-table">
                <thead>
                    <tr>
                        <th>商品名称</th>
                        <th>单价</th>
                        <th>数量</th>
                        <th>小计</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>小米14 智能手机</td>
                        <td>¥2999.00</td>
                        <td>1</td>
                        <td>¥2999.00</td>
                    </tr>
                    <tr>
                        <td>手机壳（赠品）</td>
                        <td>¥0.00</td>
                        <td>1</td>
                        <td>¥0.00</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="order-total">
            订单总金额：¥2999.00
        </div>
    </div>
</body>
</html>
