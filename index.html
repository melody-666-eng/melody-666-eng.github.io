<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理系统 - 主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 20px;
        }
        /* 头部样式：用户名+日期 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .username {
            font-size: 18px;
            font-weight: bold;
            color: #1989fa;
        }
        .today-date {
            font-size: 14px;
            color: #666;
        }
        /* 订单概况卡片 */
        .order-summary {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .summary-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .card {
            padding: 15px;
            border-radius: 6px;
            color: #fff;
            text-align: center;
        }
        .card.total { background: #1989fa; }
        .card.paid { background: #52c41a; }
        .card.unpaid { background: #faad14; }
        .card.canceled { background: #ff4d4f; }
        .card .num {
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0;
        }
        .card .desc {
            font-size: 14px;
            opacity: 0.9;
        }
        /* 跳转按钮 */
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #1989fa;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background: #096dd9;
        }
    </style>
</head>
<body>
    <!-- 头部：用户名+今日日期 -->
    <div class="header">
        <div class="username">当前登录：莫振江</div> 
        <div class="today-date" id="todayDate"></div>
    </div>

    <!-- 本日订单概况 -->
    <div class="order-summary">
        <div class="summary-title">本日订单概况</div>
        <div class="summary-cards">
            <div class="card total">
                <div class="desc">总订单数</div>
                <div class="num">86</div>
            </div>
            <div class="card paid">
                <div class="desc">已支付</div>
                <div class="num">68</div>
            </div>
            <div class="card unpaid">
                <div class="desc">待支付</div>
                <div class="num">15</div>
            </div>
            <div class="card canceled">
                <div class="desc">已取消</div>
                <div class="num">3</div>
            </div>
        </div>

        <!-- 跳转按钮 -->
        <div class="btn-group">
            <button class="btn" onclick="window.location.href='order-list.html'">查看全部订单</button>
            <button class="btn" onclick="window.location.href='order-detail.html'">查看订单详情</button>
        </div>
    </div>

    <script>
        // 动态显示今日日期
        function formatDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
            return `${year}年${month}月${day}日 星期${week}`;
        }
        document.getElementById('todayDate').textContent = formatDate();
    </script>
</body>
</html>
